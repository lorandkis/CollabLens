version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./logs:/var/log/custom-logs
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - MYSQL_DSN='mysql:host=db;dbname=${MYSQL_DATABASE};charset=utf8'
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DISCORD_INVITE=${DISCORD_INVITE}

  db:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: discord_bot
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./discord-bot:/app
      - ./discord-bot/discord.log:/app/discord.log

  # api:
  #   build:
  #     context: ./node-api
  #   ports:
  #     - "4000:4000"
  #   env_file:
  #     - .env
  #   working_dir: /usr/src/app
  #   volumes:
  #     - ./node-api:/usr/src/app
  #   command: ["node", "index.js"]


volumes:
  db_data:
